# Render blueprint: one-click deploy of the Smart Prescription backend.
# Connect this repo at https://dashboard.render.com → New → Blueprint.
services:
  - type: web
    name: smart-prescription-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Auto-set by Render
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-7
      - key: HF_WHISPER_MODEL
        value: openai/whisper-large-v3-turbo
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      # Secrets — Render will require you to fill these in via the dashboard.
      # `sync: false` means the value is NOT in this file (good, it's in git);
      # Render shows the key in the Environment tab and refuses to deploy until set.
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
